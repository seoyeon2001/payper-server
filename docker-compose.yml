services:
  app:
    container_name: app
    image: gyehyunbak/payper-server:${IMAGE_TAG}
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - /home/ubuntu/secrets/firebase-service-account.json:/etc/secrets/firebase-service-account.json:ro
      - /home/ubuntu/payper-app/logs:/logs
    networks:
      - payper-network

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/webroot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - app
    restart: always
    networks:
      - payper-network

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/webroot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - payper-network

networks:
  payper-network:
    driver: bridge