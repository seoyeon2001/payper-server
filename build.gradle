plugins {
  id 'java'
  id 'war'
  id 'io.spring.dependency-management' version '1.1.7'
}

group 'com.payper'
version '1.0-SNAPSHOT'

dependencyManagement {
  imports {
    mavenBom "org.springframework:spring-framework-bom:6.2.9"
    mavenBom "org.springframework.security:spring-security-bom:6.2.4"
  }
}

repositories {
  mavenCentral()
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

configurations {
//  compileOnly {
//    extendsFrom annotationProcessor
//    }
  mybatisGenerator
}

dependencies {
  // 스프링
  implementation 'org.springframework:spring-core'
  implementation 'org.springframework:spring-context'
  implementation 'org.springframework:spring-web'
  implementation 'org.springframework:spring-webmvc'
  implementation 'org.springframework:spring-jdbc'
  implementation 'org.springframework:spring-tx'
  testImplementation 'org.springframework:spring-test'

  implementation 'org.springframework.security:spring-security-web'
  implementation 'org.springframework.security:spring-security-config'
  implementation 'org.springframework.security:spring-security-core'

  //jwt
  implementation("io.jsonwebtoken:jjwt-api:0.11.5")
  runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
  implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")

  // AOP
  implementation 'org.aspectj:aspectjrt:1.9.20'
  implementation 'org.aspectj:aspectjweaver:1.9.20'

  // SERVLET
  implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
  compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

  // Logging
  implementation 'ch.qos.logback:logback-classic:1.5.18'
  runtimeOnly 'org.apache.logging.log4j:log4j-to-slf4j:2.24.3'
  implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'

  // xml내 한글 처리
  implementation 'xerces:xercesImpl:2.12.2'

  // Lombok
  compileOnly 'org.projectlombok:lombok:1.18.38'
  annotationProcessor 'org.projectlombok:lombok:1.18.38'
  testCompileOnly 'org.projectlombok:lombok:1.18.38'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

  // Jackson
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.2'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.19.2'
  implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.19.2'

  // 데이터베이스
  implementation 'org.mybatis:mybatis:3.5.19'
  implementation 'org.mybatis:mybatis-spring:3.0.5'
  implementation 'com.zaxxer:HikariCP:7.0.0'
  implementation 'com.mysql:mysql-connector-j:9.3.0'

  // 테스트
  testImplementation platform('org.junit:junit-bom:5.12.2')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation 'org.assertj:assertj-core:3.27.3'
  testImplementation 'org.mockito:mockito-core:5.17.0'
  testImplementation 'org.mockito:mockito-junit-jupiter:5.17.0'
  
  //sql
  implementation 'javax.annotation:javax.annotation-api:1.3.2'
  implementation 'org.apache.commons:commons-dbcp2:2.9.0'

  // MyBatis Generator
  mybatisGenerator 'org.mybatis.generator:mybatis-generator-core:1.4.0'
  mybatisGenerator 'mysql:mysql-connector-java:8.0.28'

  // codef easy
  implementation 'io.codef.api:easycodef-java:1.0.6'

  // okhttp
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'org.json:json:20240303'

  //gson
  implementation 'com.google.code.gson:gson:2.10.1'

  //resttemplate
  implementation 'org.apache.httpcomponents:httpcore:4.4.15'
  implementation 'org.apache.httpcomponents:httpclient:4.5.13'

  //jsoup
  implementation 'org.jsoup:jsoup:1.15.3'

  // 한국어 형태소 분석
  implementation 'org.openkoreantext:open-korean-text:2.1.0'
}

task mybatisGenerator(type: JavaExec) {
  group = "MyBatis"
  description = "Run MyBatis Generator"
  classpath = configurations.mybatisGenerator
  mainClass = 'org.mybatis.generator.api.ShellRunner'
  args = ['-configfile', 'src/main/resources/generatorConfig.xml', '-overwrite']
}

test {
  useJUnitPlatform()
}

tasks.withType(JavaCompile) {
  options.compilerArgs << "-parameters"
}
